{% extends 'base.html' %}
{% load my_tags %}

{% block title %}{{ blogposts.title }}{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-sm w-100">
                {% if blogposts.preview %}
                    <img src="{{ blogposts.preview|media_filter }}"
                         class="card-img-top w-100"
                         style="height: 300px; object-fit: cover;"
                         alt="{{ blogposts.title }}">
                {% endif %}

                <div class="card-header text-center fw-bold">
                    {{ blogposts.title }}
                </div>

                <div class="card-body">
                    <p class="card-text">
                        {{ blogposts.content }}
                    </p>
                </div>

                <div class="card-footer bg-white d-flex justify-content-start">
                    <a href="{% url 'blog:blog_list' %}" class="btn btn-outline-primary">
                        Назад
                    </a>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
