{% extends 'base.html' %}
{% load my_tags %}

{% block title %}Удаление записи{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-sm border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">Удаление записи</h4>
                </div>

                <div class="card-body text-center">
                    <p class="fs-5 mb-3">
                        Вы уверены, что хотите удалить запись?
                    </p>

                    <h5 class="fw-bold">{{ blogposts.title }}</h5>

                    <img src="{{ blogposts.preview|media_filter }}"
                         class="img-fluid rounded my-3"
                         style="max-height: 200px; object-fit: cover;"
                         alt="{{ blogposts.title }}">


                    <p class="text-muted mt-3 mb-0">
                        Это действие нельзя отменить!
                    </p>
                </div>

                <div class="card-footer bg-white">
                    <form method="post" class="d-flex justify-content-between">
                        {% csrf_token %}
                        <a href="{% url 'blog:blog_detail' blogposts.pk %}"
                           class="btn btn-primary">
                            Отмена
                        </a>
                        <button type="submit" class="btn btn-danger">
                            Удалить
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
