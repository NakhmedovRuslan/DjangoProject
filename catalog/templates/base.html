<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Маркетплейс{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        :root {
            --sidebar-width: 250px;
        }

        .sidebar {
            width: var(--sidebar-width);
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1050;
        }

        .main-content {
            padding-left: var(--sidebar-width);
            min-height: 100vh;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: relative;
                width: 100%;
                min-height: auto;
                border-bottom: 1px solid #333;
            }
            .main-content {
                padding-left: 0;
            }
        }
    </style>
</head>
<body class="d-flex flex-column">

    <div class="sidebar bg-dark text-white d-flex flex-column">
        <nav class="navbar navbar-dark bg-dark border-bottom border-secondary">
            <a class="navbar-brand text-white ps-3" href="#">
                <svg class="bi pe-none me-2" width="30" height="24"><use xlink:href="#bootstrap"></use></svg>
                Меню
            </a>
        </nav>

        <div class="navbar-nav my-2">
            <a class="nav-link bg-primary text-white ps-3 active rounded-3" href="{% url 'catalog:home' %}">
                <i class="bi bi-house me-2"></i>Главная
            </a>
            <a class="nav-link text-white ps-3" href="{% url 'catalog:categories' %}">
                <i class="bi bi-speedometer2 me-2"></i>Категории
            </a>
            <a class="nav-link text-white ps-3" href="#">
                <i class="bi bi-calculator me-2"></i>Заказы
            </a>
            <a class="nav-link text-white ps-3" href="{% url 'catalog:contacts' %}">
                <i class="bi bi-people-circle me-2"></i>Контакты
            </a>
        </div>

        <div class="mt-auto p-3 border-top border-secondary">
            <a class="dropdown-toggle text-white text-decoration-none d-block" href="#" role="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                <img src="https://github.com/mdo.png" alt="" width="32" height="32" class="rounded-circle me-2">
                Пользователь
            </a>
            <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="userDropdown">
                <li><a class="dropdown-item" href="#">Профиль</a></li>
                <li><a class="dropdown-item" href="#">Выход</a></li>
            </ul>
        </div>
    </div>

    <main class="main-content flex-grow-1">
        <div class="container-fluid px-4">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
