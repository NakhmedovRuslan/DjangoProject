{% load my_tags %}

<div class="col-3 m-5">
    <div class="card w-100 h-100 d-flex flex-column">
        <img src="{{ product.image|media_filter }}"
             class="card-img-top w-100"
             style="height: 200px; object-fit: contain;"
             alt="{{ product.name }}">

        <div class="card-header text-center fw-bold">
            {{ product.name }}
        </div>

        <div class="card-body d-flex flex-column">
            <h2 class="card-title text-center">
                {{ product.price }} ₽
            </h2>

            <p class="card-text">
                {{ product.description|truncatechars:35 }}
            </p>

            <a href="{% url 'catalog:product_detail' pk=product.pk %}"
               class="btn btn-outline-primary mt-auto">
                Подробнее
            </a>
        </div>

        <div class="card-footer bg-white border-top-0 d-flex justify-content-between">
            <a href="{% url 'catalog:product_update' pk=product.pk %}"
               class="btn btn-outline-primary">
                Редактировать
            </a>
            <a href="{% url 'catalog:product_delete' pk=product.pk %}"
               class="btn btn-outline-danger">
                Удалить
            </a>
        </div>
    </div>
</div>
