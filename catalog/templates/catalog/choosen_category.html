{% extends 'base.html' %}

{% block title %}Категории{% endblock %}

{% block content %}
<h1 class="text-center mt-5 pt-4"> Вы находитесь в категории {{ category.name }} </h1>

<div class="row justify-content-center g-5 px-5 m-5">
    {% for product in products %}
        {% include 'catalog/product_card.html' %}

    {% empty %}
        <p class="text-center">Товаров в выбранной категории нет.</p>
    {% endfor %}
</div>
{% endblock %}
